services:
  postgres:
    image: postgres:16-alpine
    container_name: ryaxa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ryaxa}
    ports:
      - "5434:5432"  # Host:Container - using 5434 to avoid conflict with existing 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ryaxa-network

  redis:
    image: redis:7-alpine
    container_name: ryaxa-redis
    restart: unless-stopped
    ports:
      - "6380:6379"  # Host:Container - using 6380 to avoid conflict with existing 6379
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ryaxa-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ryaxa-network:
    driver: bridge

