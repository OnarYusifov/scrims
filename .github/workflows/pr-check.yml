name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-validation:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper diff checking

      - name: Check PR target branch
        run: |
          if [ "${{ github.base_ref }}" != "dev" ] && [ "${{ github.base_ref }}" != "main" ]; then
            echo "❌ PR must target 'dev' or 'main' branch"
            exit 1
          fi
          echo "✅ PR target branch is valid"

      - name: Check for direct commits to protected branches
        run: |
          # Check if PR is trying to merge directly into dev/main from another protected branch
          BASE_REF="${{ github.base_ref }}"
          HEAD_REF="${{ github.head_ref }}"
          
          if [ "$HEAD_REF" = "dev" ] || [ "$HEAD_REF" = "main" ]; then
            echo "❌ Cannot create PR from protected branch ($HEAD_REF)"
            echo "Please create a feature branch first"
            exit 1
          fi
          echo "✅ PR is from feature branch"

      - name: Check commit messages
        run: |
          # Check if commits follow conventional commit format
          git log ${{ github.base_ref }}..HEAD --pretty=format:"%s" | while read commit_msg; do
            if ! echo "$commit_msg" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .+"; then
              echo "⚠️ Warning: Commit message doesn't follow conventional commits:"
              echo "   $commit_msg"
              echo "   Format: type(scope): description"
              echo "   Types: feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert"
            fi
          done

      - name: Scan for secrets with gitleaks
        run: |
          # Install gitleaks
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          # Scan the diff between base and head
          DIFF_FILE=pr_diff.patch
          git diff origin/${{ github.base_ref }}...origin/${{ github.head_ref }} > $DIFF_FILE
          ./gitleaks detect --source=$DIFF_FILE --no-git --exit-code 0
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Gitleaks detected secrets in the PR diff. Please remove any secrets before merging."
            exit 1
          else
            echo "✅ No secrets detected by gitleaks."
          fi
        shell: bash

