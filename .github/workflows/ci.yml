name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bunx turbo run lint

      - name: Run type check
        run: bunx turbo run check-types

      - name: Build all packages
        run: bunx turbo run build

  test:
    name: Test
    runs-on: ubuntu-latest
    # Uncomment when you have tests
    # if: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Uncomment when you have tests
      # - name: Run tests
      #   run: bunx turbo run test

